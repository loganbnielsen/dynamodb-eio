name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.x
      - name: Pin https-eio
        run: opam pin add https-eio git+https://github.com/loganbnielsen/https-eio.git#main --no-action
      - name: Pin aws-eio
        run: opam pin add aws-eio git+https://github.com/loganbnielsen/aws-eio.git#main --no-action
      - name: Install opam dependencies
        run: opam install . --deps-only --with-test --with-doc
      - name: Lint opam file
        run: opam exec -- opam lint dynamodb-eio.opam
      - name: Build
        run: opam exec -- dune build @all
      - name: Test
        run: opam exec -- dune runtest
      - name: Build docs
        run: opam exec -- dune build @doc

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform -chdir=terraform fmt -check -diff
      - name: Init (no backend, no AWS credentials needed)
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform validate
